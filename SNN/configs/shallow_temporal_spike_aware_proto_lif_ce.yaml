name: shallow_temporal_spike_aware_proto_lif_ce
model:
  architecture: shallow_temporal_spike_aware_proto_lif
  feature_mode: temporal_map
  hidden_dim: 64
  beta: 0.90
  threshold: 1.0
  learn_beta: false
  learn_threshold: false
  surrogate: atan
  dropout: 0.30
  gate_kernel: 9
  prototypes_per_class: 4
  init_gamma: 8.0
  learn_gamma: true
  learn_prototype_bias: true
  prototype_sep_margin: 0.0
loss:
  lambda_supcon: 0.0
  lambda_proto_sep: 0.0
  supcon_temperature: 0.10
training:
  batch_size: 64
  feature_batch_size: 256
  epochs: 120
  patience: 20
  val_size: 0.20
  lr: 0.001
  weight_decay: 0.0001
  scheduler_patience: 8
  scheduler_factor: 0.5
  seed: 42
